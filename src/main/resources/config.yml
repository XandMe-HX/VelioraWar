# ==============================================
# VelioraWar - konfigurasi utama
# Semua durasi bertipe detik kecuali ada keterangan lain
# Jalankan /vgwar reload setelah mengubah file ini
# ==============================================

settings:
  # Bahasa internal plugin. Saat ini tersedia: id
  locale: id
  # Kalau true, semua perubahan arena langsung disimpan ke arenas.yml
  auto-save-arena: true
  # Status global. /vgwar disable mengaktifkan maintenance tanpa membuka arena ke member.
  enabled: true
  # Interval pemeriksaan item ilegal. 20 ticks = 1 detik
  illegal-item-scan-ticks: 20

match:
  # Durasi maksimal duel/team match
  duration-seconds: 600
  # Durasi hitung mundur sebelum pemain boleh bergerak
  countdown-seconds: 4
  # Pemain benar-benar dikunci di koordinat spawn selama countdown.
  freeze-players: true
  # Player masih boleh menggerakkan kamera saat tubuhnya dibekukan.
  freeze-allow-look: true
  # Efek gelap selama countdown. Set false jika tidak disukai.
  freeze-blindness: true
  # Match otomatis mulai saat kedua team penuh
  require-full-teams: true
  # Damage teman satu team dimatikan
  friendly-fire: false
  # Saat waktu habis, total damage terbesar menang
  timeout-winner-by-damage: true
  # Waktu sebelum pemain dikembalikan ke lokasi /vgwar set stay.
  end-delay-seconds: 3
  sudden-death:
    enabled: true
    start-at-seconds: 60
    health: 1.0
    disable-totems: true
    disable-refill: true

queue:
  # Masukkan pemain ke antrean saat semua arena yang cocok sedang dipakai
  enabled: true
  # Batas antrean per kombinasi mode dan ukuran
  max-size: 100

# Kunci fokus saat player sudah masuk aktivitas war, termasuk saat countdown dan All Mode.
# Teleport internal VelioraWar (spawn, void, selesai match) selalu tetap diizinkan.
war-lock:
  # Blok seluruh command player: /tp, /home, /spawn, /msg, /vgwar, dan command plugin lain.
  block-commands: true
  # Blok teleport dari luar plugin: command, plugin lain, ender pearl, chorus fruit, dan sejenisnya.
  block-external-teleport: true
  # Ender pearl tetap boleh selama tujuan masih berada di dalam claim arena.
  allow-ender-pearl-inside-arena: true
  # Mencegah chat dipenuhi pesan teleport dari plugin lain.
  message-cooldown-milliseconds: 2000

void:
  # Pemain yang jatuh di bawah batas ini dianggap tereliminasi
  enabled: true
  y-level: -64.0
  # false = kembali ke spawn team yang dipilih tanpa eliminasi.
  # true = jatuh dianggap kalah/tereliminasi.
  count-as-death: false
  # Pulihkan health saat dikembalikan ke spawn team.
  restore-health: true

cooldowns:
  # Jeda klik GUI untuk mencegah spam packet
  gui-milliseconds: 250
  # Jeda join setelah keluar atau selesai bermain
  join-seconds: 3
  # Refill hanya bisa diambil satu kali per durasi ini
  refill-seconds: 60
  # Cooldown sementara kalau dikeluarkan oleh Cheat Guard
  # Detektor Bukkit bersifat bukti awal; jangan mengunci pemain satu hari penuh.
  cheat-kick-seconds: 600

anti-cheat:
  enabled: true
  illegal-items:
    enabled: true
    # Item yang tidak berasal dari loadout aktif akan dihapus dari inventory war
    remove: true

loadouts:
  # Semua slot kosong setelah kit utama diisi satu totem per slot.
  fill-empty-slots-with-totems: true

protection:
  # Block arena tidak hancur oleh crystal, anchor, TNT, creeper, dan ledakan lain
  explosion-block-damage: false
  # Damage ledakan ke entity/player tetap aktif untuk CPVP
  explosion-entity-damage: true
  # Pemain di luar aktivitas war tidak bisa mengubah arena
  block-outsiders: true
  # Semua block yang berubah saat match dikembalikan setelah selesai
  restore-temporary-blocks: true
  # Air dari bucket dan alirannya ikut dicatat lalu dikembalikan saat match selesai.
  restore-liquid-flow: true

npc:
  # NPC refill menggunakan Villager bawaan sehingga tidak wajib Citizens
  name: '&e&l[ REFIL ITEMS ]'
  hologram: '&b&lᴄʟɪᴄᴋ ᴛᴏ ʀᴇꜰɪʟ'
  entity-type: VILLAGER
  invulnerable: true
  silent: true
  # Jarak NPC menoleh ke pemain terdekat.
  look-range: 10.0
  # Diatur melalui /vgwar npc set 1 atau /vgwar npc set 2. Tidak terikat arena.
  locations: {}

# Warp lama tetap menjadi fallback agar data server lama aman.
warp: {}
# Satu lokasi akhir global, diatur melalui /vgwar set stay.
stay: {}
